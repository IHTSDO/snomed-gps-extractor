<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOMED GPS Extractor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1d1d1f;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px dashed #d2d2d7;
            border-radius: 8px;
            background: #fafafa;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0077ed;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SNOMED GPS Extractor</h1>
        <form id="filterForm">
            <div class="form-group">
                <label for="file">Input File (TSV)</label>
                <input type="file" id="file" name="file" accept=".tsv,.txt" required>
            </div>

            <div class="form-group">
                <label>Active Concepts Only</label>
                <div style="display: flex; align-items: center;">
                    <input type="checkbox" id="activeOnly" name="activeOnly" style="width: auto; margin-right: 10px;">
                    <span>Filter for active concepts only</span>
                </div>
            </div>

            <div class="form-group">
                <label>Select Semantic Tags</label>
                <div class="tag-groups">
                    <div class="tag-group">
                        <h3>Clinical</h3>
                        <label><input type="checkbox" name="tag" value="body structure"> Body structure</label>
                        <label><input type="checkbox" name="tag" value="cell"> Cell</label>
                        <label><input type="checkbox" name="tag" value="cell structure"> Cell structure</label>
                        <label><input type="checkbox" name="tag" value="morphologic abnormality"> Morphologic
                            abnormality</label>
                        <label><input type="checkbox" name="tag" value="finding"> Clinical finding</label>
                        <label><input type="checkbox" name="tag" value="disorder"> Disorder</label>
                        <label><input type="checkbox" name="tag" value="organism"> Organism</label>
                        <label><input type="checkbox" name="tag" value="procedure"> Procedure</label>
                        <label><input type="checkbox" name="tag" value="regime/therapy"> Regime/Therapy</label>
                        <label><input type="checkbox" name="tag" value="situation"> Situation</label>
                        <label><input type="checkbox" name="tag" value="specimen"> Specimen</label>
                        <label><input type="checkbox" name="tag" value="substance"> Substance</label>
                    </div>
                    <div class="tag-group">
                        <h3>Pharmaceutical / Product</h3>
                        <label><input type="checkbox" name="tag" value="product"> Product</label>
                        <label><input type="checkbox" name="tag" value="clinical drug"> Clinical drug</label>
                        <label><input type="checkbox" name="tag" value="medicinal product"> Medicinal product</label>
                        <label><input type="checkbox" name="tag" value="medicinal product form"> Medicinal product
                            form</label>
                        <label><input type="checkbox" name="tag" value="physical object"> Physical object</label>
                    </div>
                    <div class="tag-group">
                        <h3>Metadata & Qualifiers</h3>
                        <label><input type="checkbox" name="tag" value="attribute"> Attribute</label>
                        <label><input type="checkbox" name="tag" value="core metadata concept"> Core metadata
                            concept</label>
                        <label><input type="checkbox" name="tag" value="foundation metadata concept"> Foundation
                            metadata concept</label>
                        <label><input type="checkbox" name="tag" value="link assertion"> Link assertion</label>
                        <label><input type="checkbox" name="tag" value="namespace concept"> Namespace concept</label>
                        <label><input type="checkbox" name="tag" value="qualifier value"> Qualifier value</label>
                        <label><input type="checkbox" name="tag" value="record artifact"> Record artifact</label>
                    </div>
                    <div class="tag-group">
                        <h3>Other</h3>
                        <label><input type="checkbox" name="tag" value="environment"> Environment</label>
                        <label><input type="checkbox" name="tag" value="geographic location"> Geographic
                            location</label>
                        <label><input type="checkbox" name="tag" value="event"> Event</label>
                        <label><input type="checkbox" name="tag" value="observable entity"> Observable entity</label>
                        <label><input type="checkbox" name="tag" value="physical force"> Physical force</label>
                        <label><input type="checkbox" name="tag" value="social concept"> Social concept</label>
                        <label><input type="checkbox" name="tag" value="staging scale"> Staging scale</label>
                        <label><input type="checkbox" name="tag" value="assessment scale"> Assessment scale</label>
                        <label><input type="checkbox" name="tag" value="tumor staging"> Tumor staging</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="customTags">Additional Tags (comma separated)</label>
                <input type="text" id="customTags" name="customTags" placeholder="e.g. custom tag 1, custom tag 2">
            </div>
            <button type="submit" id="submitBtn">Process & Download</button>
        </form>
        <div id="status" class="status"></div>
    </div>

    <style>
        .tag-groups {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .tag-group h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.25rem;
        }

        .tag-group label {
            display: block;
            font-weight: normal;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }

        .tag-group input[type="checkbox"] {
            margin-right: 0.5rem;
        }
    </style>

    <script>
        document.getElementById('filterForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('file');
            const customTagsInput = document.getElementById('customTags');
            const activeOnlyInput = document.getElementById('activeOnly');
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');

            if (!fileInput.files[0]) {
                alert('Please select a file');
                return;
            }

            // Collect selected tags
            const selectedTags = Array.from(document.querySelectorAll('input[name="tag"]:checked'))
                .map(cb => cb.value);

            // Add custom tags
            if (customTagsInput.value.trim()) {
                const customTags = customTagsInput.value.split(',').map(t => t.trim()).filter(t => t);
                selectedTags.push(...customTags);
            }

            if (selectedTags.length === 0) {
                alert('Please select at least one semantic tag');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('tags', selectedTags.join(','));
            formData.append('activeOnly', activeOnlyInput.checked);

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            statusDiv.textContent = 'Uploading and processing file...';

            try {
                const response = await fetch('/api/filter', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Processing failed');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;

                // Get filename from header or default
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'filtered_output.tsv';
                if (contentDisposition) {
                    const matches = /filename="?([^"]+)"?/.exec(contentDisposition);
                    if (matches && matches[1]) {
                        filename = matches[1];
                    }
                }

                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                statusDiv.textContent = 'Download started!';
            } catch (error) {
                console.error('Error:', error);
                statusDiv.textContent = 'Error processing file. Please check the console.';
                alert('An error occurred while processing the file.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Process & Download';
            }
        });
    </script>
</body>

</html>
